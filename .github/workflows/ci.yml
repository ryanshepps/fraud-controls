name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fraudgencli-lint:
    name: fraudgencli lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraudgencli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: fraudgencli/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy src tests

  fraudgencli-test-build:
    name: fraudgencli test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraudgencli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: fraudgencli/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

  scoring-sidecar:
    name: scoring sidecar lint, test, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controls-platform/modules/scoring-sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Check formatting
        run: uv run --with ruff ruff format --check src tests

      - name: Lint
        run: uv run --with ruff ruff check src tests

      - name: Test
        run: PYTHONPATH=src uv run python -m unittest discover -s tests

      - name: Build package
        run: uv build

  controls-platform-format:
    name: controls platform format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controls-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

  controls-platform-test:
    name: controls platform test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controls-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test
        run: ./gradlew test --no-daemon

  controls-platform-build:
    name: controls platform build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controls-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Validate compose config
        run: docker compose config --quiet
