[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudgen"
version = "0.1.0"
description = "Deterministic synthetic P2P fraud traffic generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-PyYAML>=6.0.12.20260518",
]

[project.scripts]
fraudgen = "fraudgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
