services:
  redpanda:
    image: redpandadata/redpanda:v24.2.9
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  dynamodb:
    image: amazon/dynamodb-local:2.5.4
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "18000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS -X POST
          -H 'X-Amz-Target: DynamoDB_20120810.ListTables'
          -H 'Content-Type: application/x-amz-json-1.0'
          -H "Authorization: AWS4-HMAC-SHA256 Credential=dummy/$$(date -u +%Y%m%d)/us-east-1/dynamodb/aws4_request, SignedHeaders=host;x-amz-date, Signature=dummy"
          -H "X-Amz-Date: $$(date -u +%Y%m%dT%H%M%SZ)"
          -d '{}' http://localhost:8000 | grep -q TableNames
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  scoring-sidecar:
    build:
      context: ./modules/scoring-sidecar
    ports:
      - "50051:50051"
    environment:
      PORT: "50051"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:50051/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 12

  controls-platform:
    build:
      context: .
    ports:
      - "18080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TRANSACTIONS_TOPIC: transactions
      DECISIONS_TOPIC: controls.decisions
      RULE_EVALUATIONS_TOPIC: rule_evaluations
      SHADOW_EVALUATIONS_TOPIC: shadow_evaluations
      RULE_CHANGES_TOPIC: rule_changes
      FRAUD_LABELS_TOPIC: fraud_labels
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_DECISIONS_TABLE: controls_decisions
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SCORING_SIDECAR_URL: http://scoring-sidecar:50051/score
      HTTP_PORT: "8080"
    depends_on:
      redpanda:
        condition: service_healthy
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      scoring-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/metrics >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  fraudgen-feed:
    build:
      context: ..
      dockerfile: fraudgencli/Dockerfile
    command:
      - stream-config
      - --config
      - examples/controls-demo-stream.yaml
      - --bootstrap-servers
      - redpanda:9092
      - --topic
      - transactions
      - --label-topic
      - fraud_labels
      - --loop
      - --delay-ms
      - "500"
    depends_on:
      redpanda:
        condition: service_healthy
      controls-platform:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker-compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker-compose/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      controls-platform:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
