syntax = "proto3";

package fraudcontrols.decisioning.v1;

option java_multiple_files = true;
option java_package = "com.fraudcontrols.decisioning.v1";

message DecisionRequest {
  string event_id = 1;
}

message DecisionResponse {
  string event_id = 1;
  DecisionAction action = 2;
  repeated string reason_codes = 3;
}

enum DecisionAction {
  DECISION_ACTION_UNSPECIFIED = 0;
  DECISION_ACTION_ALLOW = 1;
  DECISION_ACTION_CHALLENGE = 2;
  DECISION_ACTION_HOLD = 3;
  DECISION_ACTION_DENY = 4;
}

service DecisioningService {
  rpc Decide(DecisionRequest) returns (DecisionResponse);
}
