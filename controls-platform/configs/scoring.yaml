scoring:
  features:
    - name: fraud_model_score
      provider: scorer
      scorer: primary_scorer

  scorers:
    - name: primary_scorer
      type: failover
      primary: shadow_wrapped_xgb
      # Use the heuristic scorer only when the model service is down, timing out, or returning errors.
      fallback: heuristic
      timeout_ms: 30

    - name: shadow_wrapped_xgb
      type: shadow
      primary: demo_sidecar
      shadows: [demo_candidate]

    - name: demo_sidecar
      type: xgboost
      sidecar_address: "http://scoring-sidecar:50051/score"
      model_id: "deterministic-demo-v1"

    - name: demo_candidate
      type: xgboost
      sidecar_address: "http://scoring-sidecar:50051/score"
      model_id: "candidate-demo-v1"

    - name: heuristic
      type: rule_based
      config_path: configs/heuristic.yaml
